<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Quiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-4">
        <h1 class="mb-4">Python Quiz</h1>
        
        <div class="row">
            <div class="col-md-4">
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0">Topics</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-2">
                            <button id="selectAll" class="btn btn-sm btn-secondary me-2">Select All</button>
                            <button id="deselectAll" class="btn btn-sm btn-secondary">Deselect All</button>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input topic" type="checkbox" value="basics" id="basics" checked>
                            <label class="form-check-label" for="basics">Python Basics</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input topic" type="checkbox" value="functions" id="functions" checked>
                            <label class="form-check-label" for="functions">Functions</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input topic" type="checkbox" value="oop" id="oop" checked>
                            <label class="form-check-label" for="oop">OOP</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input topic" type="checkbox" value="modules" id="modules" checked>
                            <label class="form-check-label" for="modules">Modules & Packages</label>
                        </div>
                    </div>
                </div>

                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0">Settings</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="numQuestions" class="form-label">Number of Questions:</label>
                            <input type="number" class="form-control" id="numQuestions" value="50" min="1" max="100">
                        </div>
                        <div class="mb-3">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="practiceMode">
                                <label class="form-check-label" for="practiceMode">Practice Mode</label>
                            </div>
                        </div>
                        <button id="startQuiz" class="btn btn-primary w-100">Start Quiz</button>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div id="questionArea" class="card mb-4 d-none">
                    <div class="card-header d-flex justify-content-between">
                        <h5 class="mb-0">Question <span id="currentQuestion">1</span>/<span id="totalQuestions">50</span></h5>
                        <div>Time: <span id="timer">00:00</span></div>
                    </div>
                    <div class="card-body">
                        <p id="questionText" class="mb-4"></p>
                        <div id="options" class="mb-3"></div>
                        <button id="submitAnswer" class="btn btn-primary">Submit Answer</button>
                        <button id="nextQuestion" class="btn btn-secondary d-none">Next Question</button>
                    </div>
                </div>

                <div id="resultsArea" class="card d-none">
                    <div class="card-header">
                        <h5 class="mb-0">Quiz Results</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <h6>Score: <span id="score">0</span>%</h6>
                            <h6>Correct Answers: <span id="correctAnswers">0</span></h6>
                            <h6>Time Taken: <span id="timeTaken">00:00</span></h6>
                        </div>
                        <div id="incorrectAnswers"></div>
                        <button id="restartQuiz" class="btn btn-primary mt-3">Start New Quiz</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
